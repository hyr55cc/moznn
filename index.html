<style>
/* mozn.css — MOZN istighfar app (dark, night-green theme). Cosmetic recreation. */
:root{
  --bg:#0a1a0f;--bg2:#0d2014;--card:#0f2516;--card2:#122d1a;
  --green:#1a7a40;--green2:#28a05e;--green3:#3dcc78;
  --gold:#c8980a;--gold2:#e8b820;--gold3:#ffd060;
  --txt:#e8f5ee;--txt2:#90b898;--muted:#4a7058;
  --bdr:rgba(200,152,10,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{margin:0;background:#0a1a0f;}
.app{background:var(--bg);color:var(--txt);font-family:'Tajawal','Segoe UI',system-ui,sans-serif;direction:rtl;min-height:100vh;position:relative;overflow:hidden;max-width:430px;margin:0 auto;}
#bgc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.fg{position:relative;z-index:1;padding-bottom:90px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(10,26,15,0.6);backdrop-filter:blur(10px);}
.conn-badge{display:flex;align-items:center;gap:6px;background:rgba(61,204,120,0.1);border:1px solid rgba(61,204,120,0.25);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--green3);font-weight:600;}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--green3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.theme-dots{display:flex;gap:7px;align-items:center;}
.tdot{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:transform .2s;}
.tdot.on{border-color:var(--gold2);transform:scale(1.2);}

.title-wrap{text-align:center;padding:10px 20px 16px;}
.app-title{font-family:'Amiri',serif;font-size:40px;font-weight:700;color:var(--gold2);line-height:1.1;letter-spacing:1px;}
.app-verse{font-family:'Amiri',serif;font-size:16px;color:var(--txt2);margin-top:8px;line-height:1.7;}
.welcome{font-size:13px;color:var(--muted);margin-top:6px;}

.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 16px;}
.ss{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:12px 8px;text-align:center;}
.ss-val{font-size:20px;font-weight:900;color:var(--txt);line-height:1;font-variant-numeric:tabular-nums;}
.ss-lbl{font-size:9px;color:var(--muted);margin-top:5px;}

.hadith-box{background:rgba(200,152,10,0.08);border:1px solid rgba(200,152,10,0.2);border-radius:14px;margin:0 14px 16px;padding:14px 16px;}
.hadith-t{font-family:'Amiri',serif;font-size:17px;color:var(--txt);line-height:1.9;text-align:center;}
.hadith-s{font-size:11px;color:var(--gold);margin-top:6px;text-align:center;font-weight:600;}

.btn-wrap{display:flex;flex-direction:column;align-items:center;padding:0 20px 20px;}
.btn-outer{width:280px;height:280px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 8px rgba(26,122,64,0.2),0 0 0 16px rgba(26,122,64,0.08),0 20px 60px rgba(0,0,0,0.4);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:none;transition:transform .12s,box-shadow .12s;position:relative;}
.btn-outer:active{transform:scale(.93);}
.btn-counter{position:absolute;top:-6px;right:-6px;width:44px;height:44px;border-radius:50%;background:var(--gold2);color:#0a1a0f;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);font-variant-numeric:tabular-nums;}
.btn-ar{font-family:'Amiri',serif;font-size:38px;color:#fff;font-weight:700;line-height:1.2;text-align:center;}
.btn-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;}
.ripple3{position:absolute;border-radius:50%;border:2px solid rgba(61,204,120,0.5);width:280px;height:280px;top:0;left:0;animation:rpl3 .9s ease-out forwards;pointer-events:none;}
@keyframes rpl3{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.65);opacity:0}}

.name-level{text-align:center;margin-bottom:16px;}
.name-txt{font-size:18px;font-weight:800;color:var(--txt);}
.level-txt{font-size:12px;color:var(--gold);margin-top:2px;}

.prog-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;margin:0 14px 14px;padding:14px 16px;}
.prog-top{display:flex;justify-content:space-between;margin-bottom:10px;}
.prog-lbl{font-size:12px;color:var(--gold);font-weight:700;}
.prog-val{font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums;}
.prog-track{height:6px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;margin-bottom:14px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green3));border-radius:99px;transition:width .5s;}
.prog-boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pbox{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-align:center;}
.pbox-val{font-size:24px;font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums;}
.pbox-lbl{font-size:10px;color:var(--muted);margin-top:3px;}

.share-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bdr);border-radius:12px;margin:0 14px 16px;padding:10px 14px;}

.mode-seg { display: flex; gap: 8px; }
.mode-opt { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--bdr); background: var(--card2); color: var(--txt2); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .2s; }
.mode-opt.on { background: linear-gradient(135deg, var(--green2), var(--green)); color: #fff; border-color: var(--green2); }

.contact-input { width: 100%; padding: 12px 14px; border: 1px solid var(--bdr); border-radius: 12px; background: var(--card2); color: var(--txt); font-size: 14px; font-family: inherit; resize: vertical; outline: none; line-height: 1.7; }
.contact-input::placeholder { color: var(--muted); }
.login-btn:disabled { opacity: .45; cursor: not-allowed; }

.made-by { text-align: center; font-size: 13px; color: var(--muted); padding: 16px 0 8px; }
.made-by strong { color: var(--gold2); }

.login-logo-img { display: block; width: 150px; height: 150px; object-fit: contain; margin: 0 auto 14px; filter: drop-shadow(0 14px 36px rgba(0,0,0,.55)); animation: logoIn .8s ease; }

/* ===================== DAY (light) MODE ===================== */
.app.light .topbar { background: rgba(255,253,246,0.78); }
.app.light .conn-badge { color: var(--green); }
.app.light .prog-track { background: rgba(0,0,0,0.07); }
.app.light .pbox { background: rgba(0,0,0,0.035); }
.app.light .sbox { background: rgba(0,0,0,0.035); }
.app.light .sbox.gold3 { background: rgba(168,125,24,0.1); }
.app.light .lb-row { border-color: rgba(0,0,0,0.07); }
.app.light .pd { background: rgba(0,0,0,0.12); }
.app.light .sl { background: rgba(0,0,0,0.18); }
.app.light .bot-row { border-bottom-color: rgba(0,0,0,0.07); }
.app.light .lb-rank-badge { background: rgba(0,0,0,0.05); color: var(--txt); }
.app.light .sabha-ring .ring-bg { stroke: rgba(0,0,0,0.08); }
.app.light .sabha-ring-btn::before { box-shadow: 0 12px 30px rgba(23,48,41,.12); }
.app.light .app-logo { filter: drop-shadow(0 8px 22px rgba(23,48,41,.2)); }
.app.light .sval, .app.light .prof-val, .app.light .dhikr-active { color: var(--green); }
.app.light .ss, .app.light .scard, .app.light .cfg-card, .app.light .prog-card,
.app.light .hadith-box, .app.light .lb-section .lb-row, .app.light .nav {
  box-shadow: 0 6px 18px rgba(23,48,41,.06);
}
.app.light #bgc { opacity: .6; }

/* ===================== phone layout: fixed bars, scrolling content ===================== */
.app { height: 100vh; max-height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.fg { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0 !important; }
.topbar { flex-shrink: 0; }
.scroll-area { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll-area::-webkit-scrollbar { display: none; }
.nav { position: relative !important; flex-shrink: 0; }

</style>

<style>
  html, body { background: #060f08; min-height: 100vh; }
  body { display: flex; justify-content: center; }
  /* phone-like column on wide screens */
  #root { width: 100%; max-width: 430px; }
  .app { box-shadow: 0 0 80px rgba(0,0,0,0.6); }
</style>
</head>

  function oldDayMatches(ld, cd) {
    if (!ld) return false;
    try { return new Date(ld).toISOString().slice(0, 10) === cd; } catch (e) { return false; }
  }
  function joinedOf(u) {
    if (u.joined) return u.joined;
    if (u.lastDate) { try { return new Date(u.lastDate).toISOString().slice(0, 10); } catch (e) { return u.lastDate; } }
    if (u.lastActive) { try { return new Date(u.lastActive).toISOString().slice(0, 10); } catch (e) {} }
    return "";
  }

  function defaultState(name) {
    return {
      me: {
        id: "me", name: name, total: 0, today: 0, todayDate: today(),
        streak: 0, lastDay: null, firstPlaceCount: 0, bestDay: 0,
        goal: 100, joined: today(), history: {},
        weekId: weekId(), weekN: 0, monthId: monthId(), monthN: 0,
        countryFlag: "🇸🇦", // علم الدولة الافتراضي
      },
      others: [],
      settings: { themeId: 2, mode: "night", sound: true, haptic: true, sabhaPhase: 0, sabhaCount: 0, sabhaDhikr: 0 },
      _wasFirst: false,
    };
  }

  // ---- store core -------------------------------------------------------
  var state = null;
  var listeners = [];
  function notify() { listeners.forEach(function (fn) { try { fn(state); } catch (e) {} }); }
  function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { state = JSON.parse(raw); migrate(); return state; }
    } catch (e) {}
    return null;
  }
  function migrate() {
    if (!state.settings) state.settings = { themeId: 2, mode: "night", sound: true, haptic: true, sabhaPhase: 0, sabhaCount: 0, sabhaDhikr: 0 };
    if (!state.settings.mode) state.settings.mode = "night";
    if (state.settings.sabhaDhikr == null) state.settings.sabhaDhikr = 0;
    if (!state.me.history) state.me.history = {};
    if (state.me.bestDay == null) state.me.bestDay = 0;
    if (state.me.weekN == null) { state.me.weekId = weekId(); state.me.weekN = 0; }
    if (state.me.monthN == null) { state.me.monthId = monthId(); state.me.monthN = 0; }
    if (!state.others) state.others = [];
    // reset runtime-only firebase flags so the live listener re-attaches every load
    state._fbStarted = false;
    state._fbReady = false;
    state._wasFirst = false;
    if (window.MOZN_DB) state.others = []; // avoid showing a stale cached board
  }

  function rolloverDay() {
    var t = today();
    if (state.me.todayDate !== t) {
      // archive yesterday's count into history before reset
      if (state.me.today > 0) state.me.history[state.me.todayDate] = state.me.today;
      state.me.today = 0;
      state.me.todayDate = t;
    }
  }

  // ---- leaderboard ------------------------------------------------------
  function ranked(metric) {
    metric = metric || "total";
    var me = {
      id: "me", name: state.me.name, total: state.me.total,
      daily: myDaily(), weekly: myWeekly(), monthly: myMonthly(),
      firstPlaceCount: state.me.firstPlaceCount, joined: state.me.joined, me: true,
      countryFlag: state.me.countryFlag || "🇸🇦",
    };
    var others = state.others.map(function (u) {
      return {
        id: u.id, name: u.name, total: u.total || 0,
        daily: u.daily || 0, weekly: u.weekly || 0, monthly: u.monthly || 0,
        firstPlaceCount: u.firstPlaceCount || 0, joined: u.joined || "",
        countryFlag: u.countryFlag || "🇸🇦",
      };
    });
    var all = [me].concat(others);
    // تصفية المستخدمين الذين لا يملكون أي استغفار في الفئة المحددة
    all = all.filter(function (u) { return u[metric] > 0; });
    all.sort(function (a, b) { return (b[metric] || 0) - (a[metric] || 0); });
    all.forEach(function (u, i) { u.rank = i + 1; });
    return all;
  }

  function checkFirstPlace() {
    var board = ranked();
    var isFirst = board[0] && board[0].id === "me";
    var ready = !fbEnabled() || state._fbReady;
    var todayKey = today();
    
    // تهيئة بيانات اليوم إذا لم تكن موجودة
    if (!state._firstPlaceDaily) {
      state._firstPlaceDaily = {};
    }
    
    if (isFirst && !state._wasFirst && state.me.total > 0 && ready) {
      // زيادة العداد الكلي
      state.me.firstPlaceCount++;
      
      // تسجيل المركز الأول لهذا اليوم
      if (!state._firstPlaceDaily[todayKey]) {
        state._firstPlaceDaily[todayKey] = 1;
      }
      
      scheduleWrite();
    }
    state._wasFirst = isFirst;
  }

  // ---- Firebase (shared live leaderboard) -------------------------------
  function fbEnabled() { return !!window.MOZN_DB; }
  function ensureUid() {
    if (!state._uid) state._uid = "u_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    return state._uid;
  }
  var _wt = null;
  var _LVL_EN = ["beginner", "dhakir", "mujtahid", "mukthir", "awwab", "muhsin", "siddiq"];
  function writeMe() {
    if (!fbEnabled() || !state) return;
    var idx = window.moznLevel(state.me.total).index;
    try {
      window.MOZN_DB.ref("users/" + state._uid).update({
        uid: state._uid,
        name: state.me.name,
        total: state.me.total,
        totalCount: state.me.total,        // interop with the original moznn schema
        today: state.me.today,
        todayDate: state.me.todayDate,
        todayCount: state.me.today,
        day: { id: state.me.todayDate, n: state.me.today },
        week: { id: state.me.weekId, n: state.me.weekN || 0 },
        month: { id: state.me.monthId, n: state.me.monthN || 0 },
        streak: state.me.streak,
        dailyGoal: state.me.goal,
        level: _LVL_EN[idx] || "beginner",
        firstPlaceCount: state.me.firstPlaceCount,
        joined: state.me.joined,
        lastActive: Date.now(),
      })["catch"](function (e) { console.warn("FB write denied:", e && e.message); });
    } catch (e) { console.warn("FB write error:", e); }
  }
  function scheduleWrite() {
    if (!fbEnabled() || _wt) return;
    _wt = setTimeout(function () { _wt = null; writeMe(); }, 900);
  }
  function startFirebase() {
    if (!fbEnabled() || !state || state._fbStarted) return;
    state._fbStarted = true;
    state.others = []; // real users only
    writeMe();
    try {
      window.MOZN_DB.ref("users").on("value", function (snap) {
        var val = snap.val() || {};
        state.others = Object.keys(val)
          .filter(function (k) { return k !== state._uid; })
          .map(function (k) {
            var u = val[k] || {};
            var tot = (u.total != null ? u.total : (u.totalCount != null ? u.totalCount : 0));
            var cd = today(), cw = weekId(), cm = monthId();
            var daily = (u.day && u.day.id === cd) ? (u.day.n || 0)
                      : (u.todayDate === cd ? (u.today || 0)
                      : (oldDayMatches(u.lastDate, cd) ? (u.todayCount || 0) : 0));
            var weekly = (u.week && u.week.id === cw) ? (u.week.n || 0) : 0;
            var monthly = (u.month && u.month.id === cm) ? (u.month.n || 0) : 0;
            return { id: k, name: u.name || "مستغفر", total: tot, daily: daily, weekly: weekly, monthly: monthly, firstPlaceCount: u.firstPlaceCount || 0, joined: joinedOf(u) };
          });
        if (!state._fbReady) {
          // first snapshot: set baseline rank without counting a false #1
          state._fbReady = true;
          var b0 = ranked();
          state._wasFirst = !!(b0[0] && b0[0].id === "me");
          notify();
          return;
        }
        checkFirstPlace();
        notify();
      }, function (err) { console.warn("FB read denied:", err && err.message); });
    } catch (e) { console.warn("FB listen error:", e); }
  }

  // ---- public API -------------------------------------------------------
  var Store = {
    LEVELS: LEVELS,
    init: function (savedName) {
      if (!load()) {
        if (savedName) state = defaultState(savedName);
        else return null; // need login
      }
      ensureUid();
      rolloverDay();
      checkFirstPlace();
      persist();
      if (fbEnabled()) startFirebase(); else this._startLive();
      return state;
    },
    register: function (name) {
      state = defaultState(name || "ضيف");
      ensureUid();
      if (fbEnabled()) state.others = [];
      persist(); notify();
      if (fbEnabled()) startFirebase(); else this._startLive();
      return state;
    },
    get: function () { return state; },
    subscribe: function (fn) {
      listeners.push(fn);
      return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
    },

    // core action: add one istighfar
    increment: function (by) {
      by = by || 1;
      rolloverDay();
      var first = state.me.today === 0; // first of the day?
      state.me.today += by;
      state.me.total += by;
      var wid = weekId(); if (state.me.weekId !== wid) { state.me.weekId = wid; state.me.weekN = by; } else { state.me.weekN = (state.me.weekN || 0) + by; }
      var mid = monthId(); if (state.me.monthId !== mid) { state.me.monthId = mid; state.me.monthN = by; } else { state.me.monthN = (state.me.monthN || 0) + by; }
      if (state.me.today > state.me.bestDay) state.me.bestDay = state.me.today;
      // streak bookkeeping on first action of a day
      if (first) {
        if (state.me.lastDay === yesterday()) state.me.streak += 1;
        else if (state.me.lastDay !== today()) state.me.streak = 1;
        state.me.lastDay = today();
      }
      checkFirstPlace();
      persist(); notify();
      scheduleWrite();
    },

    setGoal: function (g) { state.me.goal = Math.max(1, g | 0); persist(); notify(); },
    setSetting: function (k, v) { state.settings[k] = v; persist(); notify(); },
    setCountryFlag: function (flag) { state.me.countryFlag = flag; persist(); notify(); },
    setSabha: function (count, phase) {
      state.settings.sabhaCount = count;
      state.settings.sabhaPhase = phase;
      
      // إذا انتهى من السبحة، إضافة العدد للاستغفار اليومي
      if (count === 0 && state.settings.sabhaCount !== undefined && state.settings.sabhaCount > 0) {
        var sabhaCompleted = state.settings.sabhaCount || 0;
        if (sabhaCompleted > 0) {
          // إضافة عدد السبحة للاستغفار اليومي والإجمالي
          state.me.today += sabhaCompleted;
          state.me.total += sabhaCompleted;
          
          // تحديث الأسبوعي والشهري
          var wid = weekId(); 
          if (state.me.weekId !== wid) { 
            state.me.weekId = wid; 
            state.me.weekN = sabhaCompleted; 
          } else { 
            state.me.weekN = (state.me.weekN || 0) + sabhaCompleted; 
          }
          
          var mid = monthId(); 
          if (state.me.monthId !== mid) { 
            state.me.monthId = mid; 
            state.me.monthN = sabhaCompleted; 
          } else { 
            state.me.monthN = (state.me.monthN || 0) + sabhaCompleted; 
          }
        }
      }
      
      persist(); notify();
    },
    setSabhaDhikr: function (i) {
      state.settings.sabhaDhikr = i;
      state.settings.sabhaCount = 0;
      persist(); notify();
    },

    ranked: ranked,
    worldTotal: function () {
      var s = state ? state.me.total : 0;
      if (state) for (var i = 0; i < state.others.length; i++) s += (state.others[i].total || 0);
      return s;
    },
    myRank: function (metric) {
      var b = ranked(metric);
      for (var i = 0; i < b.length; i++) if (b[i].id === "me") return b[i].rank;
      return b.length;
    },
    profile: function (id) {
      if (id === "me") {
        var dailyFirstPlaceCount = 0;
        var todayKey = today();
        if (state && state._firstPlaceDaily && state._firstPlaceDaily[todayKey]) {
          dailyFirstPlaceCount = state._firstPlaceDaily[todayKey];
        }
        return {
          id: "me", name: state.me.name, total: state.me.total,
          daily: myDaily(), weekly: myWeekly(), monthly: myMonthly(),
          firstPlaceCount: state.me.firstPlaceCount, 
          dailyFirstPlaceCount: dailyFirstPlaceCount,
          joined: state.me.joined,
          rank: this.myRank("total"), bestDay: state.me.bestDay, streak: state.me.streak, me: true,
        };
      }
      var u = state.others.filter(function (x) { return x.id === id; })[0];
      if (!u) return null;
      var found = ranked("total").filter(function (x) { return x.id === id; })[0];
      return Object.assign({}, u, { rank: found ? found.rank : null });
    },

    // weekly history -> last 7 days [{date,label,count}]
    weekly: function () {
      var out = [];
      var days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      for (var i = 6; i >= 0; i--) {
        var d = new Date(); d.setDate(d.getDate() - i);
        var key = d.toISOString().slice(0, 10);
        var count = key === state.me.todayDate ? state.me.today : (state.me.history[key] || 0);
        out.push({ date: key, label: days[d.getDay()], count: count, isToday: i === 0 });
      }
      return out;
    },
    
    // hijri month data
    hijriMonthData: function () {
      var hijriMonths = ["محرم","صفر","ربيع الأول","ربيع الثاني","جمادى الأولى","جمادى الثانية",
                         "رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];

      // اليوم الهجري الحالي
      var todayGreg = new Date();
      var todayHijri = getHijriDate(todayGreg);
      var curHMonth = todayHijri.month;
      var curHYear  = todayHijri.year;
      var curHDay   = todayHijri.day;
      var monthLabel = hijriMonths[curHMonth - 1] + " " + curHYear + "هـ";

      // إيجاد أول يوم ميلادي يقابل 1 من الشهر الهجري الحالي
      // نبحث عن اليوم الأول بالرجوع للخلف من اليوم الحالي
      var startGreg = new Date(todayGreg);
      startGreg.setDate(startGreg.getDate() - (curHDay - 1));

      // بناء 30 يوماً كاملة للشهر الهجري
      var out = [];
      for (var d = 1; d <= 30; d++) {
        var greg = new Date(startGreg);
        greg.setDate(greg.getDate() + (d - 1));
        var key = greg.toISOString().slice(0, 10);
        var isFuture = d > curHDay;
        var isToday  = d === curHDay;
        var count = 0;
        if (!isFuture) {
          count = key === state.me.todayDate ? state.me.today : (state.me.history[key] || 0);
        }
        out.push({ day: d, date: key, count: count, isToday: isToday, isFuture: isFuture });
      }

      return { label: monthLabel, data: out, todayDay: curHDay };
    },

    // ---- "live world": other worshippers tick up over time -------------
    _liveTimer: null,
    _startLive: function () {
      if (this._liveTimer || !state || fbEnabled()) return;
      var self = this;
      this._liveTimer = setInterval(function () {
        if (!state || !state.others.length) return;
        // bump 1–2 random users by a small amount
        var hits = 1 + (Math.random() < 0.4 ? 1 : 0);
        for (var k = 0; k < hits; k++) {
          var u = state.others[Math.floor(Math.random() * state.others.length)];
          u.total += Math.floor(Math.random() * (u.bot ? 9 : 5)) + 1;
        }
        checkFirstPlace();
        persist(); notify();
      }, 3500);
    },
    stopLive: function () {
      clearInterval(this._liveTimer); this._liveTimer = null;
      try { if (window.MOZN_DB) window.MOZN_DB.ref("users").off(); } catch (e) {}
    },
  };

  window.MoznStore = Store;
})();

</script>
<script>
// mozn-fx.js — tactile feedback: soft WebAudio tick/chime + vibration.
(function () {
  var ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  // soft wooden "tick" for each istighfar
  function tick(vol) {
    var a = ac(); if (!a) return;
    var t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(660, t);
    o.frequency.exponentialRampToValueAtTime(330, t + 0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((vol || 0.25), t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.14);
  }
  // warm chime for milestones / phase complete
  function chime() {
    var a = ac(); if (!a) return;
    var t = a.currentTime;
    [523.25, 659.25, 783.99].forEach(function (f, i) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      var s = t + i * 0.08;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.18, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
      o.connect(g); g.connect(a.destination);
      o.start(s); o.stop(s + 0.55);
    });
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {} }

  window.MoznFX = {
    tap: function (sound, haptic) { if (sound) tick(0.22); if (haptic) buzz(12); },
    milestone: function (sound, haptic) { if (sound) chime(); if (haptic) buzz([18, 40, 18]); },
    unlock: ac,
  };
})();

</script>

<script type="text/babel">
// ParticleCanvas.jsx — drifting starfield + connected gold dots (MOZN backdrop)
function ParticleCanvas({ theme, density }) {
  const ref = React.useRef(null);
  const themeRef = React.useRef(theme);
  themeRef.current = theme;
  const d = density == null ? 1 : density;
  React.useEffect(() => {
    const cv = ref.current;
    const cx = cv.getContext("2d");
    let W, H, stars = [], pts = [], raf;
    function init() {
      const host = cv.parentElement;
      W = host.offsetWidth || 390;
      H = Math.max(host.scrollHeight, 700);
      cv.width = W; cv.height = H;
      stars = []; for (let i = 0; i < Math.round(120 * d); i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .2, o: Math.random() * .7 + .1, tw: Math.random() * Math.PI * 2, sp: Math.random() * .02 + .005 });
      pts = []; for (let i = 0; i < Math.round(26 * d); i++) pts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .4, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22, o: Math.random() * .2 + .05 });
    }
    function draw() {
      const t = themeRef.current;
      const g = cx.createRadialGradient(W * .5, H * .35, 0, W * .5, H * .35, H * .9);
      g.addColorStop(0, t.s1); g.addColorStop(1, t.s2);
      cx.fillStyle = g; cx.fillRect(0, 0, W, H);
      stars.forEach(s => { s.tw += s.sp; const a = s.o * (.6 + .4 * Math.sin(s.tw)); cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI * 2); cx.fillStyle = "rgba(255,255,255," + a + ")"; cx.fill(); });
      pts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, Math.PI * 2); cx.fillStyle = "rgba(" + t.dot + "," + p.o + ")"; cx.fill(); });
      pts.forEach((p, i) => { for (let j = i + 1; j < pts.length; j++) { const q = pts[j], d = Math.hypot(p.x - q.x, p.y - q.y); if (d < 90) { cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(q.x, q.y); cx.strokeStyle = "rgba(" + t.dot + "," + (0.05 * (1 - d / 90)) + ")"; cx.lineWidth = .5; cx.stroke(); } } });
      raf = requestAnimationFrame(draw);
    }
    init(); draw();
    window.addEventListener("resize", init);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", init); };
  }, []);
  return <canvas id="bgc" ref={ref}></canvas>;
}
window.ParticleCanvas = ParticleCanvas;

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

    <>

function TweakRow({ label, value, children, inline = false }) {

    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function CounterPage({ st, anim, shape, openShare, onProfile, fx }) {
  const me = st.me;
  const [ripples, setRipples] = useState([]);
  const [hadithIdx, setHadithIdx] = useState(0);
  const [pop, setPop] = useState(false);
  const rid = useRef(0);
  const world = MoznStore.worldTotal();
  const lvl = moznLevel(me.total);

  useEffect(function () {
    const h = setInterval(function () {
      setHadithIdx(function (i) { return (i + 1) % MOZN_HADITHS.length; });
    }, 9000);
    return function () { clearInterval(h); };
  }, []);

  function tap() {
    const before = me.today;
    MoznStore.increment(1);
    const after = before + 1;
    const hitGoal = after === me.goal;
    const milestone = after % 33 === 0 || hitGoal;
    if (milestone) fx.milestone(); else fx.tap();
    const id = ++rid.current;
    setRipples(function (r) { return r.concat(id); });
    setTimeout(function () {
      setRipples(function (r) { return r.filter(function (x) { return x !== id; }); });
    }, 900);
    setPop(true);
    setTimeout(function () { setPop(false); }, 130);
  }

  const goalPct = Math.min(100, Math.round((me.today / me.goal) * 100));
  const hadith = MOZN_HADITHS[hadithIdx];

  return (
    <div className="page on">
      <div className="title-wrap">
        <img className="app-logo" src={window.__MOZN_ICON || "mozn/icon.png"} alt="مزن · للاستغفار" />

        <div className="welcome">مرحباً بعودتك، {me.name} — نسأل الله أن يتقبّل</div>
      </div>

      <div className="stats-strip" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
        <StatCell val={fmt(me.today)} lbl="استغفارك اليوم" />
        <StatCell val={fmtK(me.total)} lbl="إجماليك" />
        <StatCell val={fmtK(world)} lbl="إجمالي العالم" />
      </div>

      <div className="hadith-box" key={hadithIdx}>
        <div className="hadith-t">{hadith.t}</div>
        <div className="hadith-s">— {hadith.s}</div>
      </div>

      <div className="btn-wrap">
        <div className="name-level">
          <div className="name-txt">{me.countryFlag} {me.name}</div>
          <div className="level-txt">
            المركز #{MoznStore.myRank("total")} عالمياً
          </div>
        </div>

        <button
          className={"btn-outer anim-" + anim + (pop ? " pressed" : "")}
          onClick={tap}
        >
          {anim === "ripple" && <Ripples items={ripples} />}
          {anim === "glow" && <span className="glow-pulse" data-on={ripples.length > 0}></span>}
          {anim === "burst" && ripples.map(function (id) {
            return <span key={id} className="starburst">{Array.from({ length: 8 }).map(function (_, i) {
              return <i key={i} style={{ "--a": (i * 45) + "deg" }}></i>;
            })}</span>;
          })}
          <span className="btn-ar">أستغفر الله</span>
          <span className="btn-sub">العظيم وأتوب إليه</span>
        </button>
      </div>

      <div className="goal-streak-compact">
        <div className="gsc-item"><span className="gsc-lbl">الهدف:</span><span className="gsc-val">{fmt(me.today)} / {me.goal}</span></div>

        <div className="gsc-item"><span className="gsc-lbl">متتالي:</span><span className="gsc-val">🔥 {me.streak}</span></div>
      </div>

// SABHA PAGE — selectable ma'thoor adhkar counter
// ===========================================================================
function SabhaPage({ st, fx }) {
  const di = st.settings.sabhaDhikr || 0;
  const count = st.settings.sabhaCount || 0;
  const dhikr = MOZN_ADHKAR[di] || MOZN_ADHKAR[0];
  const [rounds, setRounds] = useState(0);
  const [justDone, setJustDone] = useState(false);

  function bead() {
    const s = MoznStore.get().settings;
    const d = MOZN_ADHKAR[s.sabhaDhikr || 0];
    const next = (s.sabhaCount || 0) + 1;
    
    // ✓ إضافة +1 للاستغفار تلقائياً عند كل ضغطة
    MoznStore.increment(1);
    
    if (next >= d.target) {
      fx.milestone();
      MoznStore.setSabha(0, s.sabhaPhase || 0);
      setRounds(function (r) { return r + 1; });
      setJustDone(true);
      setTimeout(function () { setJustDone(false); }, 1800);
    } else {
      fx.tap();
      MoznStore.setSabha(next, s.sabhaPhase || 0);
    }
  }
  function pick(i) { fx.tap(); MoznStore.setSabhaDhikr(i); setRounds(0); }
  function reset() { MoznStore.setSabha(0, st.settings.sabhaPhase || 0); setRounds(0); }

  const pct = Math.round((count / dhikr.target) * 100);
  const R = 86, C = 2 * Math.PI * R;

  return (
    <div className="page on">
      <div className="sabha-wrap">
        <div className="sabha-head">السُّبْحَة · الأذكار المأثورة</div>

        <div className="dhikr-chips">
          {MOZN_ADHKAR.map(function (d, i) {
            return (
              <button key={i} className={"dhikr-chip" + (i === di ? " on" : "")} onClick={function () { pick(i); }}>
                {d.t}
              </button>
            );
          })}
        </div>

        <div className="dhikr-active">{dhikr.t}</div>
        <div className="dhikr-virtue">«{dhikr.v}»</div>

        <button className="sabha-ring-btn" onClick={bead}>
          <svg className="sabha-ring" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r={R} className="ring-bg" />
            <circle cx="100" cy="100" r={R} className="ring-fg"
              style={{ strokeDasharray: C, strokeDashoffset: C * (1 - count / dhikr.target) }} />
          </svg>
          <span className="sabha-num">{count}</span>
          <span className="sabha-target">/ {dhikr.target}</span>
          <span className="sabha-tap-hint">{justDone ? "✓ تقبّل الله" : "اضغط للتسبيح"}</span>
        </button>

        <div className="sabha-meta">
          <span>{pct}%</span>
          <span>·</span>
          <span>دورات مكتملة: {fmt(rounds)}</span>
        </div>

        <button className="btn-reset" onClick={reset}>إعادة العدّ</button>
      </div>

      <ContactFooter />
    </div>
  );
}

          <div className="sbox gold3"><div className="sval">🏆 {fmt(me.firstPlaceCount)}</div><div className="slbl">مرات المركز الأول</div></div>
        </div>
      </div>

      <div className="scard">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
          <span className="scard-title" style={{ marginBottom: 0 }}>{hijri.label}</span>
          <span style={{ fontSize: "12px", color: "var(--gold2)", fontWeight: 700 }}>{fmtK(monthTotal)} هذا الشهر</span>
        </div>
        <div className="wk-chart">
          {hijri.data.map(function (d) {
            const barH = d.isFuture ? 8 : Math.max(d.count > 0 ? 6 : 3, Math.round((d.count / max) * 100));
            return (
              <div key={d.day} className="wk-col">
                <div className="wk-bar-track">
                  <div
                    className={"wk-bar" + (d.isToday ? " today" : d.isFuture ? " future" : "")}
                    style={{ height: barH + "%" }}
                  >
                    {!d.isFuture && d.count > 0 && <span className="wk-val">{fmtK(d.count)}</span>}
                  </div>
                </div>
                <div className={"wk-lbl" + (d.isToday ? " today" : "")}>{d.day}</div>
              </div>
            );
          })}
        </div>
        <div style={{ textAlign: "center", marginTop: "10px", fontSize: "11px", color: "var(--muted)" }}>
          <span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: "var(--gold)", marginInlineEnd: 4, verticalAlign: "middle" }}></span>
          اليوم {hijri.todayDay}
          <span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: "var(--green)", marginInline: "4px 4px", verticalAlign: "middle", marginInlineStart: 14 }}></span>
          أيام سابقة
        </div>
      </div>

      <div className="scard">
        <div className="scard-title">الرتبة</div>
        <div className="prog-top">
          <span className="prog-lbl">{lvl.name}</span>
          <span className="prog-val">{lvl.nextName ? "التالي: " + lvl.nextName : "أعلى رتبة"}</span>
        </div>
        <div className="prog-track"><div className="prog-fill" style={{ width: lvlPct + "%" }}></div></div>
        <div className="firebase-badge" style={{ paddingTop: 12 }}>
          {lvl.nextName ? "تبقّى " + fmt(Math.max(0, lvl.ceil - me.total)) + " استغفار للرتبة التالية" : "بلغت أعلى الرتب — تقبّل الله"}
        </div>
      </div>

      <ContactFooter />
    </div>
  );
}

Object.assign(window, { ProfileSheet, LeaderboardPage, StatsPage, avatarOf, ContactFooter });

</script>
<script type="text/babel">
// mozn-pages3.jsx — Settings page
const { useState: useStateS } = React;

function SettingsPage({ st, onTheme, onMode, onToggle, onGoal, openShare, onLogout }) {
  const me = st.me;
  const s = st.settings;
  const lvl = moznLevel(me.total);
  const [msg, setMsg] = useStateS("");
  const [sent, setSent] = useStateS(false);

  function sendMail() {
    const body = (msg || "").trim();
    const subject = "رسالة من تطبيق مزن ✦";
    
    // استخدام FormData للإرسال الصحيح
    const form = new FormData();
    form.append("email", "halfofthird@gmail.com");
    form.append("subject", subject);
    form.append("message", body);
    form.append("name", me.name);
    form.append("app", "مزن ✦");
    form.append("date", new Date().toLocaleString('ar-EG'));
    form.append("_captcha", "false");
    
    fetch("https://formsubmit.co/halfofthird@gmail.com", {
      method: "POST",
      body: form
    })
    .then(response => {
      setSent(true);
      setTimeout(function () { 
        setSent(false);
        setMsg("");
      }, 2500);
    })
    .catch(error => {
      console.error("خطأ:", error);
      setSent(true);
      setTimeout(function () { 
        setSent(false);
        setMsg("");
      }, 2500);
    });
  }

  return (
    <div className="page on cfg-page">
      <div className="cfg-card">
        <div className="cfg-title">الملف الشخصي</div>
        <div className="prof-head" style={{ marginBottom: 4 }}>
          <div className="prof-av">{avatarOf(me.name)}</div>
          <div className="prof-id">
            <div className="prof-name">{me.name}</div>
            <div className="prof-lvl">{lvl.name} · {fmt(me.total)} استغفار · 🏆 {fmt(me.firstPlaceCount)}</div>
          </div>
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">🌍 الدولة</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "8px", marginBottom: "10px" }}>
          {["🇸🇦", "🇦🇪", "🇪🇬", "🇵🇸", "🇴🇲", "🇶🇦", "🇰🇼", "🇧🇭", "🇮🇶", "🇯🇴", "🇱🇧", "🇲🇦"].map(flag => (
            <button 
              key={flag}
              onClick={() => { 
                MoznStore.setCountryFlag(flag);
              }}
              style={{
                padding: "12px",
                fontSize: "20px",
                border: s.countryFlag === flag ? "2px solid var(--green)" : "1px solid var(--bdr)",
                borderRadius: "10px",
                background: "var(--card2)",
                cursor: "pointer",
                transition: "all .2s"
              }}
            >
              {flag}
            </button>
          ))}
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">الوضع</div>
        <div className="mode-seg">
          <button className={"mode-opt" + (s.mode !== "day" ? " on" : "")} onClick={function () { onMode("night"); }}>🌙 ليلي</button>
          <button className={"mode-opt" + (s.mode === "day" ? " on" : "")} onClick={function () { onMode("day"); }}>☀️ نهاري</button>
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">الهدف اليومي</div>
        <div className="goal-row">
          <button className="goal-step" onClick={function () { onGoal(me.goal - 33); }}>−</button>
          <div className="goal-num">{fmt(me.goal)}</div>
          <button className="goal-step" onClick={function () { onGoal(me.goal + 33); }}>+</button>
        </div>
        <div className="goal-presets">
          {[33, 100, 313, 1000].map(function (g) {
            return <button key={g} className={"goal-chip" + (me.goal === g ? " on" : "")} onClick={function () { onGoal(g); }}>{fmt(g)}</button>;
          })}
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">اللون</div>
        <div className="th-grid">
          {MOZN_THEMES.map(function (t) {
            return (
              <div key={t.id} className={"th-opt" + (s.themeId === t.id ? " on" : "")} onClick={function () { onTheme(t.id); }}>
                <div className="th-sw" style={{ background: "linear-gradient(135deg," + t.g3 + "," + t.green + ")" }}></div>
                <div className="th-lbl">{t.lbl}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">التنبيهات الحسّية</div>
        <div className="bot-row">
          <span className="bot-nm">🔊 صوت عند الاستغفار</span>
          <label className="tog"><input type="checkbox" checked={s.sound} onChange={function (e) { onToggle("sound", e.target.checked); }} /><span className="sl"></span></label>
        </div>
        <div className="bot-row">
          <span className="bot-nm">📳 اهتزاز خفيف</span>
          <label className="tog"><input type="checkbox" checked={s.haptic} onChange={function (e) { onToggle("haptic", e.target.checked); }} /><span className="sl"></span></label>
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">المشاركة</div>
        <div className="share-bar" style={{ margin: 0, cursor: "pointer" }} onClick={openShare}>
          <span className="share-lbl">🤲 ادعُ صديقاً للاستغفار</span>
          <button className="copy-btn">رابط الدعوة</button>
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">تواصل معنا</div>
        <textarea
          className="contact-input" rows={3}
          placeholder="اكتب رسالتك أو ملاحظتك..."
          value={msg} onChange={function (e) { setMsg(e.target.value); }}
        ></textarea>
        <button className="login-btn" style={{ marginTop: 10 }} disabled={!msg.trim()} onClick={sendMail}>
          {sent ? "تم فتح بريدك ✓" : "إرسال إلى الفريق"}
        </button>
        <div className="firebase-badge" style={{ paddingBottom: 0 }}>
          تم الربط برسالة مباشرة
        </div>
      </div>

      <div className="cfg-card">
        <div className="cfg-title">قاعدة البيانات</div>
        <div className="firebase-badge">
          <strong id="db-mode">{window.__MOZN_DB || "قاعدة محلية (تجريبية)"}</strong><br />
          المتصدّرون يتحدّثون لحظياً
        </div>
      </div>

      <button className="btn-reset" style={{ width: "100%", marginTop: 4 }} onClick={onLogout}>تسجيل الخروج وإعادة التعيين</button>
      <div className="made-by">صُنع بواسطة <strong>نصف الثلث</strong> 🌙</div>
    </div>
  );
}

window.SettingsPage = SettingsPage;

</script>
<script type="text/babel">
// mozn-app.jsx — MOZN root: login, nav, theme application, share, tweaks

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": 2,
  "buttonAnim": "ripple",
  "buttonShape": "circle",
  "particles": 1
}/*EDITMODE-END*/;

const NAV = [
  { id: "counter", ico: "🏠", lbl: "العدّاد" },
  { id: "sabha", ico: "📿", lbl: "السبحة" },
  { id: "board", ico: "🏆", lbl: "المتصدّرون" },
  { id: "stats", ico: "📊", lbl: "الإحصائيات" },
  { id: "settings", ico: "⚙️", lbl: "الإعدادات" },
];

function applyTheme(el, t, mode) {
  if (!el || !t) return;
  const day = mode === "day";
  const v = { "--green": t.green, "--green2": t.g2, "--green3": t.g3 };
  if (day) {
    Object.assign(v, {
      "--bg": "#fbf7ec", "--bg2": "#fffdf6", "--card": "#ffffff", "--card2": "#f6efdc",
      "--txt": "#173029", "--txt2": "#5d7a6c", "--muted": "#9aa89e",
      "--gold": "#9a7414", "--gold2": "#a87d18", "--gold3": "#c79c2c",
      "--bdr": "rgba(138,106,46,0.22)",
    });
  } else {
    Object.assign(v, {
      "--bg": t.bg, "--bg2": t.bg2, "--card": t.card, "--card2": t.card2,
      "--txt": "#e8f5ee", "--txt2": "#90b898", "--muted": "#4a7058",
      "--gold": "#c8980a", "--gold2": "#e8b820", "--gold3": "#ffd060",
      "--bdr": "rgba(200,152,10,0.18)",
    });
  }
  Object.keys(v).forEach(function (k) { el.style.setProperty(k, v[k]); });
  el.classList.toggle("light", day);
}

// ---- Login ---------------------------------------------------------------
function Login({ onEnter }) {
  const [name, setName] = useState("");
  const h = MOZN_HADITHS[3];
  function go() { if (name.trim()) onEnter(name.trim()); }
  return (
    <div className="login-overlay">
      <div className="login-card" style={{ animation: "fadeUp .7s ease" }}>
        <img className="login-logo-img" src={window.__MOZN_ICON} alt="مزن" />
        <div className="login-verse">﴿ فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا ﴾</div>
        <div className="login-hadith">
          <div className="hadith-t" style={{ fontSize: 16 }}>{h.t}</div>
          <div className="hadith-s">— {h.s}</div>
        </div>
        <input
          className="login-input" placeholder="اكتب اسمك للانضمام"
          value={name} maxLength={24}
          onChange={function (e) { setName(e.target.value); }}
          onKeyDown={function (e) { if (e.key === "Enter") go(); }}
        />
        <button className="login-btn" onClick={go}>← دخول</button>
        <div className="welcome" style={{ marginTop: 14 }}>اسمك يظهر في لوحة المتصدّرين العالمية</div>
      </div>
    </div>
  );
}

// ---- Share sheet ---------------------------------------------------------
function ShareSheet({ name, onClose }) {
  const [copied, setCopied] = useState(false);
  const link = "https://hyr55cc.github.io/moznn/?ref=" + encodeURIComponent(name);
  function copy() {
    try { navigator.clipboard.writeText(link); } catch (e) {}
    setCopied(true); setTimeout(function () { setCopied(false); }, 1600);
  }
  function share() {
    const text = "انضمّ إليّ في مزن للاستغفار — شارك الأجر 🤲";
    if (navigator.share) { navigator.share({ title: "مزن ✦ للاستغفار", text: text, url: link }).catch(function () {}); }
    else copy();
  }
  return (
    <div className="sheet-scrim" onClick={onClose}>
      <div className="sheet" onClick={function (e) { e.stopPropagation(); }}>
        <div className="sheet-handle"></div>
        <div className="login-logo" style={{ fontSize: 30, marginBottom: 2 }}>🤲</div>
        <div className="prof-name" style={{ textAlign: "center", marginBottom: 4 }}>شارك الأجر مع من تحب</div>
        <div className="welcome" style={{ textAlign: "center", marginBottom: 16 }}>«الدالّ على الخير كفاعله» — من شاركته الاستغفار فلك مثل أجره</div>
        <div className="share-bar" style={{ margin: "0 0 12px" }}>
          <span className="share-url">{link}</span>
          <button className="copy-btn" onClick={copy}>{copied ? "تم النسخ ✓" : "نسخ"}</button>
        </div>
        <button className="login-btn" onClick={share}>مشاركة الدعوة</button>
      </div>
    </div>
  );
}

// ---- App -----------------------------------------------------------------
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [st, setSt] = useState(null);
  const [needLogin, setNeedLogin] = useState(false);
  const [page, setPage] = useState("counter");
  const [profileId, setProfileId] = useState(null);
  const [shareOpen, setShareOpen] = useState(false);
  const appRef = useRef(null);

  // boot
  useEffect(function () {
    const s = MoznStore.init();
    if (s) { setSt(s); } else { setNeedLogin(true); }
    const unsub = MoznStore.subscribe(function (ns) { setSt(Object.assign({}, ns)); });
    return unsub;
  }, []);

  // current mode (day/night) lives in the store settings
  const mode = st ? (st.settings.mode || "night") : "night";
  // apply theme + mode whenever either changes
  const themeObj = MOZN_THEMES[t.theme] || MOZN_THEMES[2];
  const canvasTheme = mode === "day"
    ? Object.assign({}, themeObj, { s1: "#fdf8ea", s2: "#efe4c9" })
    : themeObj;
  useEffect(function () { applyTheme(appRef.current, themeObj, mode); }, [t.theme, mode]);
  function setMode(m) { MoznStore.setSetting("mode", m); }

  const fx = {
    tap: function () { const s = st && st.settings; MoznFX.tap(s ? s.sound : true, s ? s.haptic : true); },
    milestone: function () { const s = st && st.settings; MoznFX.milestone(s ? s.sound : true, s ? s.haptic : true); },
  };

  function enter(name) {
    MoznFX.unlock();
    const s = MoznStore.register(name);
    setSt(Object.assign({}, s));
    setNeedLogin(false);
  }
  function logout() {
    try { localStorage.removeItem("mozn_state_v3"); } catch (e) {}
    MoznStore.stopLive();
    setSt(null); setNeedLogin(true); setPage("counter");
  }

  return (
    <div className="app" ref={appRef}>
      <ParticleCanvas key={"p" + t.theme + t.particles + mode} theme={canvasTheme} density={t.particles} />

      {needLogin && <Login onEnter={enter} />}

      {st && (
        <div className="fg">
          <div className="topbar">
            <div className="conn-badge"><span className="conn-dot"></span><span id="conn-label">مُتّصل</span></div>
            <div className="topbar-right">
              <button className="mode-btn" onClick={function () { setMode(mode === "day" ? "night" : "day"); }} aria-label="الوضع">
                {mode === "day" ? "☀️" : "🌙"}
              </button>
              <div className="theme-dots">
                {MOZN_THEMES.map(function (th) {
                  return <span key={th.id} className={"tdot" + (t.theme === th.id ? " on" : "")}
                    style={{ background: "linear-gradient(135deg," + th.g3 + "," + th.green + ")" }}
                    onClick={function () { setTweak("theme", th.id); }}></span>;
                })}
              </div>
            </div>
          </div>

          <div className="scroll-area">
          {page === "counter" && <CounterPage st={st} anim={t.buttonAnim} shape={t.buttonShape} openShare={function () { setShareOpen(true); }} goBoard={function () { setPage("board"); }} onProfile={setProfileId} fx={fx} />}
          {page === "sabha" && <SabhaPage st={st} fx={fx} />}
          {page === "board" && <LeaderboardPage st={st} onProfile={setProfileId} />}
          {page === "stats" && <StatsPage st={st} />}
          {page === "settings" && (
            <SettingsPage
              st={st}
              onTheme={function (id) { setTweak("theme", id); }}
              onMode={setMode}
              onToggle={function (k, v) { MoznStore.setSetting(k, v); }}
              onGoal={function (g) { MoznStore.setGoal(g); }}
              openShare={function () { setShareOpen(true); }}
              onLogout={logout}
            />
          )}
          </div>

          <nav className="nav">
            {NAV.map(function (n) {
              return (
                <button key={n.id} className={"nb" + (page === n.id ? " on" : "")} onClick={function () { setPage(n.id); }}>
                  <span className="nb-ico">{n.ico}</span>
                  <span>{n.lbl}</span>
                </button>
              );
            })}
          </nav>
        </div>
      )}

      {profileId && <ProfileSheet id={profileId} onClose={function () { setProfileId(null); }} />}
      {shareOpen && st && <ShareSheet name={st.me.name} onClose={function () { setShareOpen(false); }} />}

      {/* ---- Tweaks ---- */}
      <TweaksPanel>
        <TweakSection label="المظهر · Theme" />
        <TweakRadio label="اللون" value={t.theme}
          options={[{ value: 0, label: "زمردي" }, { value: 1, label: "وردي" }, { value: 2, label: "نيلي" }, { value: 3, label: "رملي" }]}
          onChange={function (v) { setTweak("theme", v); }} />
        <TweakSlider label="كثافة النجوم" value={t.particles} min={0} max={2} step={0.25}
          onChange={function (v) { setTweak("particles", v); }} />
        <TweakSection label="الزر الرئيسي · Counter" />
        <TweakRadio label="الحركة" value={t.buttonAnim}
          options={[{ value: "ripple", label: "موجة" }, { value: "glow", label: "توهّج" }, { value: "burst", label: "إشعاع" }]}
          onChange={function (v) { setTweak("buttonAnim", v); }} />
        <TweakRadio label="الشكل" value={t.buttonShape}
          options={[{ value: "circle", label: "دائرة" }, { value: "pill", label: "حبّة" }, { value: "minimal", label: "بسيط" }]}
          onChange={function (v) { setTweak("buttonShape", v); }} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
